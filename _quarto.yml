project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "notes/**/*.qmd"

website:
  description: "Personal website and blog of Nadhira Azzahra Hendra"
  site-url: "https://nadhira.me"
  title: "Nadhira A. Hendra"
  favicon: favicon.svg
  image: profile.jpg
  open-graph: true
  twitter-card: true
  navbar:
    search: true
    pinned: true
    tools:
      - icon: envelope
        href: mailto:azzahra.ndhr@gmail.com
      - icon: github
        href: https://github.com/azzahrandhr
      - icon: linkedin
        href: https://www.linkedin.com/in/azzahrandhr/
    left:
      - text: "Projects"
        href: blog.qmd
      # Notes is hidden until the first real note is written; uncomment to restore
      # - text: "Notes"
      #   href: notes.qmd
      - text: "Reading"
        href: reading.qmd
      - text: "About"
        href: about.qmd
  page-footer:
    border: false
    center: "© <span class='footer-year'>2026</span> Nadhira A. Hendra · Made with [Quarto](https://quarto.org)"

format:
  html:
    respect-user-color-scheme: true
    theme:
      light: [cosmo, _theme-common.scss, theme-light.scss]
      dark: [cosmo, _theme-common.scss, theme-dark.scss]
    include-after-body: _footer-year.html
execute:
  freeze: auto


  